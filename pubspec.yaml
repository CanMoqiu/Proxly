name: proxly
description: "Clash proxy monitor and control panel."
publish_to: 'none'

version: 26.6.0+35

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  open_file: ^3.3.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_inappwebview: ^6.0.0
  dartssh2: 2.22.2
  flutter_svg: ^2.0.0
  path_provider: ^2.1.0
  archive: ^3.6.1
  crypto: ^3.0.7
  file_picker: ^8.1.2
  flutter_secure_storage: ^10.3.4
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.4
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  shared_preferences_android: 2.4.10

flutter:
  uses-material-design: true
  fonts:
    - family: ProxlyMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
  assets:
    - assets/fonts/
    - assets/web_panel/
    - assets/web_panel/assets/
    - assets/icons/
    - assets/app_icon.png
