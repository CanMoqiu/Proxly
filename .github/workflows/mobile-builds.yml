name: Proxly 双端打包 / Mobile builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支、标签或提交 / Branch, tag, or commit
        required: true
        default: main
        type: string
      platform:
        description: 构建平台（both 双端、android 安卓、ios 苹果）/ Target platforms
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - android
      android_build_type:
        description: Android 签名正式构建或独立调试包 / Signed release or separate debug APK
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      draft_release_tag:
        description: 私有草稿标签（留空使用 Artifact）/ Private draft tag (blank for artifacts)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: proxly-${{ inputs.platform }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 打包 / Android build
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/../flutter-sdk-3.47.5
      ANDROID_BUILD_TYPE: ${{ inputs.android_build_type }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取源码 / Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: 核对私有草稿 / Verify private draft
        if: inputs.draft_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
        run: python3 scripts/upload_draft_build.py verify
      - name: 配置 Java / Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 缓存工具链与依赖 / Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-check-${{ runner.os }}-3.47.5-${{ hashFiles('pubspec.lock', 'android/**/gradle-wrapper.properties') }}
          restore-keys: android-check-${{ runner.os }}-3.47.5-
      - name: 安装 Flutter / Install Flutter
        run: |
          mkdir -p build-logs
          git rev-parse HEAD | tee build-logs/commit.txt
          ruby --version | tee build-logs/ruby.txt
          if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" config --no-analytics
          "$FLUTTER_ROOT/bin/flutter" --version | tee build-logs/flutter.txt
      - name: 静态检查与测试 / Analyze and test
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter pub get --enforce-lockfile 2>&1 | tee build-logs/dependencies.txt
          flutter analyze 2>&1 | tee build-logs/analyze.txt
          flutter test 2>&1 | tee build-logs/tests.txt
      - name: 预取并校验 Gradle / Prefetch and verify Gradle
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import urlsplit

          props = dict(line.strip().split('=', 1) for line in
                       Path('android/gradle/wrapper/gradle-wrapper.properties').read_text().splitlines()
                       if line.strip() and not line.lstrip().startswith('#'))
          assert props['distributionBase'] == props['zipStoreBase'] == 'GRADLE_USER_HOME'
          assert props['distributionPath'] == props['zipStorePath'] == 'wrapper/dists'
          url = props['distributionUrl'].replace('\\:', ':')
          assert urlsplit(url).scheme == 'https'
          assert urlsplit(url).hostname in {'services.gradle.org', 'downloads.gradle.org'}
          checksum = props['distributionSha256Sum']
          assert re.fullmatch(r'[0-9a-f]{64}', checksum)
          name = Path(urlsplit(url).path).name
          assert name.startswith('gradle-') and name.endswith('-all.zip')
          # Wrapper cache keys use MD5/base36 for location, not integrity.
          number = int.from_bytes(hashlib.md5(url.encode()).digest(), 'big')
          bucket = ''
          while number:
              number, digit = divmod(number, 36)
              bucket = '0123456789abcdefghijklmnopqrstuvwxyz'[digit] + bucket
          root = Path(os.environ.get('GRADLE_USER_HOME', str(Path.home() / '.gradle')))
          archive = root / 'wrapper/dists' / name[:-4] / (bucket or '0') / name
          installed = archive.parent / name.removesuffix('-all.zip') / 'bin/gradle'
          if archive.with_suffix('.zip.ok').is_file() and installed.is_file():
              print('Using installed Gradle wrapper cache')
              raise SystemExit(0)
          archive.parent.mkdir(parents=True, exist_ok=True)
          temporary = archive.with_suffix('.zip.download')
          try:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                              '--retry', '4', '--retry-all-errors', '--retry-delay', '3',
                              '--retry-max-time', '300', '--connect-timeout', '15',
                              '--max-time', '120', '--output', str(temporary), url], check=True)
              digest = hashlib.sha256()
              with temporary.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != checksum:
                  raise RuntimeError('Gradle distribution SHA-256 mismatch')
              temporary.replace(archive)
              print('Gradle distribution SHA-256 verified')
          finally:
              temporary.unlink(missing_ok=True)
          PY
      - name: 准备正式签名 / Restore release signing key
        if: inputs.android_build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/prepare_android_signing.py
      - name: 构建 Android APK / Build Android APK
        run: |
          case "$ANDROID_BUILD_TYPE" in release|debug) ;; *) exit 1 ;; esac
          flutter build apk "--$ANDROID_BUILD_TYPE" --target-platform android-arm64,android-x64 2>&1 | tee build-logs/android-build.txt
      - name: 核验并打包 Android / Verify and package Android
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          export APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          export AAPT2="$(dirname "$APKSIGNER")/aapt2"
          python3 scripts/package_android.py "$ANDROID_BUILD_TYPE"
      - name: 清理签名材料 / Remove signing material
        if: always()
        run: rm -f -- android/key.properties "$RUNNER_TEMP/proxly-release.p12"
      - name: 上传 Android 到私有草稿 / Upload Android to private draft
        if: inputs.draft_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
        run: python3 scripts/upload_draft_build.py android
      - name: 保存 Android 安装包 / Save Android APK
        if: inputs.draft_release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: proxly-android-${{ inputs.android_build_type }}-${{ github.run_number }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 保存 Android 诊断 / Save Android diagnostics
        if: always() && inputs.draft_release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-logs/
          retention-days: 14
  build:
    name: iOS 打包 / iOS build
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.5
      FLUTTER_ROOT: ${{ github.workspace }}/../flutter-sdk-3.47.5
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取源码 / Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: 核对私有草稿 / Verify private draft
        if: inputs.draft_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
        run: python3 scripts/upload_draft_build.py verify
      - name: 记录源码与工具链 / Record source and toolchain
        run: |
          mkdir -p build-logs
          git rev-parse HEAD | tee build-logs/commit.txt
          xcodebuild -version | tee build-logs/xcode.txt
          test -f ios/Runner.xcodeproj/project.pbxproj || { echo '此版本尚不包含 iOS 工程 / This ref does not contain the iOS project.'; exit 1; }
      - name: 缓存工具链与依赖 / Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
      - name: 安装 Flutter / Install Flutter
        run: |
          if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version | tee build-logs/flutter.txt
          "$FLUTTER_ROOT/bin/flutter" config --no-analytics --no-enable-swift-package-manager
      - name: 缓存工具链与依赖 / Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ios-deps-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock') }}
          restore-keys: ios-deps-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-
      - name: 安装依赖 / Install dependencies
        run: flutter pub get --enforce-lockfile 2>&1 | tee build-logs/dependencies.txt
      - name: 静态检查与测试 / Analyze and test
        run: |
          flutter analyze 2>&1 | tee build-logs/analyze.txt
          flutter test 2>&1 | tee build-logs/tests.txt
      - name: 验证 iPhone 模拟器 WebView / Validate simulator WebViews
        timeout-minutes: 15
        run: |
          xcrun simctl list devices available --json > build-logs/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("build-logs/simulators.json"))["devices"]; print(next(v["udid"] for k in sorted(d, reverse=True) if "iOS" in k for v in d[k] if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          trap 'xcrun simctl io "$SIMULATOR_ID" screenshot build-logs/ios-simulator.png || true; xcrun simctl spawn "$SIMULATOR_ID" log show --last 3m --predicate '\''process == "Runner"'\'' --style compact > build-logs/ios-system.txt || true' EXIT
          flutter test integration_test/web_panel_smoke_test.dart -d "$SIMULATOR_ID" --no-pub --reporter expanded 2>&1 | tee build-logs/ios-webview-smoke.txt
      - name: 构建未签名真机应用 / Build unsigned device app
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build-logs/ios-build.txt
          git diff --exit-code -- ios/Podfile.lock
      - name: 核验并打包 IPA / Validate and package IPA
        run: python3 scripts/package_ios.py
      - name: 上传 iOS 到私有草稿 / Upload iOS to private draft
        if: inputs.draft_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
        run: python3 scripts/upload_draft_build.py ios
      - name: 保存 iOS 安装包 / Save iOS package
        if: inputs.draft_release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: proxly-ios-unsigned-${{ github.run_number }}
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 保存 iOS 诊断 / Save iOS diagnostics
        if: always() && inputs.draft_release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-logs/
            ios/Podfile.lock
          retention-days: 14
