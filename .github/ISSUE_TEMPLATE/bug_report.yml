name: "问题反馈（中文）"
description: "报告可以复现的问题，默认使用中文"
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请先确认最新版本是否仍有问题。不要提交控制器密钥、SSH 密码、私钥、真实地址或个人数据。安全漏洞请使用私密报告入口。"
  - type: input
    id: version
    attributes:
      label: "Proxly 版本"
      description: "填写关于页显示的版本号。"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "平台与系统"
      description: "Android/iOS、设备型号和系统版本。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "按顺序说明操作，以及出现问题的条件。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "预期结果"
      description: "你原本希望发生什么？"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "实际结果"
      description: "实际出现了什么？是否每次都发生？"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志或截图"
      description: "仅上传脱敏内容；不要包含凭据或私钥。"
    validations:
      required: false
